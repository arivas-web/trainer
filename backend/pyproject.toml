[project]
name = "pulse-backend"
version = "0.1.0"
description = "Pulse: laboratorio personal de rendimiento (backend)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "fitdecode>=0.11.0",
    "gpxpy>=1.6.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "fit-tool>=0.9.16",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en castellano con tildes y signos

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
